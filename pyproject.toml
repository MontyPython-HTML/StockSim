[project]
name = "hackrice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Quentin Bordelon", email = "qgbordelon@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "google-genai>=2.23.0",
    "python-dotenv>=1.2.3",
    "yfinance>=1.7.0",
    "psycopg2>=2.9.13",
    "plotly>=7.0.0",
    "pandas>=3.0.5",
]

[project.scripts]
hackrice = "hackrice:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
